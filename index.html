<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Instrument Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            paper: '#F4F6F8',
            ink: '#16202E',
            muted: '#5B6778',
            line: '#DDE3EA',
            brand: { DEFAULT: '#1F5F5B', dark: '#174946', tint: '#E3F0EE' },
            danger: { DEFAULT: '#B42318', tint: '#FDECEA' },
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-paper font-sans text-ink antialiased">
  <header class="border-b border-line bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-5 sm:px-6">
      <div>
        <h1 class="text-xl font-semibold tracking-tight sm:text-2xl">Student Management System</h1>
        <p class="text-sm text-muted">Register students and keep the class list up to date.</p>
      </div>
      <div class="rounded-full bg-brand-tint px-4 py-1.5 text-sm font-medium text-brand">
        <span id="count">0</span> students
      </div>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-6 px-4 py-8 sm:px-6 lg:grid-cols-[22rem_1fr] lg:items-start">
    <!-- Add student -->
    <section class="rounded-2xl border border-line bg-white p-6 lg:sticky lg:top-6">
      <h2 class="text-lg font-semibold">Add a student</h2>

      <div id="form-error" role="alert" class="mt-4 hidden rounded-lg bg-danger-tint px-3 py-2 text-sm text-danger"></div>

      <div id="student-form" class="mt-4 space-y-4">
        <div>
          <label for="name" class="mb-1 block text-sm font-medium">Full name</label>
          <input id="name" type="text" maxlength="100" autocomplete="off" placeholder="Ananya Raman"
            class="w-full rounded-lg border border-line px-3 py-2 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/30" />
        </div>
        <div>
          <label for="roll_number" class="mb-1 block text-sm font-medium">Roll number</label>
          <input id="roll_number" type="text" maxlength="30" autocomplete="off" placeholder="CS2024-017"
            class="w-full rounded-lg border border-line px-3 py-2 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/30" />
        </div>
        <div>
          <label for="email" class="mb-1 block text-sm font-medium">Email address</label>
          <input id="email" type="email" maxlength="120" autocomplete="off" placeholder="ananya@example.com"
            class="w-full rounded-lg border border-line px-3 py-2 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/30" />
        </div>
        <div>
          <label for="course" class="mb-1 block text-sm font-medium">Course</label>
          <input id="course" type="text" maxlength="100" autocomplete="off" placeholder="B.Sc. Computer Science"
            class="w-full rounded-lg border border-line px-3 py-2 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/30" />
        </div>
        <button id="add-btn" type="button"
          class="w-full rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">
          Add student
        </button>
      </div>
    </section>

    <!-- Students table -->
    <section class="overflow-hidden rounded-2xl border border-line bg-white">
      <div class="border-b border-line px-6 py-4">
        <h2 class="text-lg font-semibold">All students</h2>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full min-w-[40rem] text-left text-sm">
          <thead class="bg-paper text-muted">
            <tr>
              <th class="px-6 py-3 font-medium">Student</th>
              <th class="px-6 py-3 font-medium">Roll number</th>
              <th class="px-6 py-3 font-medium">Course</th>
              <th class="px-6 py-3 text-right font-medium">Action</th>
            </tr>
          </thead>
          <tbody id="student-rows" class="divide-y divide-line"></tbody>
        </table>
      </div>

      <p id="status" class="px-6 py-10 text-center text-sm text-muted">Loading students…</p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"
    class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 rounded-lg bg-ink px-4 py-2.5 text-sm text-white opacity-0 shadow-lg transition duration-200">
  </div>

  <script>
    // When opened from disk (file://) talk to the local server; otherwise use the same origin.
    const API_URL = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';

    const els = {
      rows: document.getElementById('student-rows'),
      status: document.getElementById('status'),
      count: document.getElementById('count'),
      error: document.getElementById('form-error'),
      toast: document.getElementById('toast'),
      addBtn: document.getElementById('add-btn'),
      fields: ['name', 'roll_number', 'email', 'course'].map((id) => document.getElementById(id)),
    };

    const escapeHtml = (value) =>
      String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const initials = (name) =>
      name.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('');

    let toastTimer;
    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.remove('opacity-0', 'translate-y-4');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.add('opacity-0', 'translate-y-4'), 2500);
    }

    function showError(message) {
      els.error.textContent = message;
      els.error.classList.toggle('hidden', !message);
    }

    // Turns FastAPI error payloads (string or validation list) into a readable message.
    async function readError(response) {
      try {
        const { detail } = await response.json();
        if (typeof detail === 'string') return detail;
        if (Array.isArray(detail)) {
          return detail
            .map((d) => `${d.loc[d.loc.length - 1].replace('_', ' ')}: ${d.msg}`)
            .join('. ');
        }
      } catch (_) { /* fall through */ }
      return 'Something went wrong. Please try again.';
    }

    function renderStudents(students) {
      els.count.textContent = students.length;
      els.rows.innerHTML = students
        .map(
          (s) => `
        <tr class="hover:bg-paper/60">
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-tint text-xs font-semibold text-brand">${escapeHtml(initials(s.name))}</span>
              <div class="min-w-0">
                <p class="truncate font-medium">${escapeHtml(s.name)}</p>
                <p class="truncate text-muted">${escapeHtml(s.email)}</p>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 font-medium">${escapeHtml(s.roll_number)}</td>
          <td class="px-6 py-4">${escapeHtml(s.course)}</td>
          <td class="px-6 py-4 text-right">
            <button data-id="${s.id}" data-name="${escapeHtml(s.name)}"
              class="delete-btn rounded-lg px-3 py-1.5 text-sm font-medium text-danger transition hover:bg-danger-tint focus:outline-none focus:ring-2 focus:ring-danger">
              Delete
            </button>
          </td>
        </tr>`
        )
        .join('');

      els.status.textContent = 'No students yet. Add the first one using the form.';
      els.status.classList.toggle('hidden', students.length > 0);
    }

    async function loadStudents() {
      try {
        const res = await fetch(`${API_URL}/students`);
        if (!res.ok) throw new Error();
        renderStudents(await res.json());
      } catch (_) {
        els.rows.innerHTML = '';
        els.status.classList.remove('hidden');
        els.status.textContent = 'Could not reach the server. Make sure the backend is running.';
      }
    }

    async function addStudent() {
      showError('');
      const [name, roll_number, email, course] = els.fields.map((f) => f.value.trim());

      if (!name || !roll_number || !email || !course) {
        showError('Fill in all four fields to add a student.');
        return;
      }

      els.addBtn.disabled = true;
      els.addBtn.textContent = 'Adding…';
      try {
        const res = await fetch(`${API_URL}/students`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, roll_number, email, course }),
        });
        if (!res.ok) {
          showError(await readError(res));
          return;
        }
        els.fields.forEach((f) => (f.value = ''));
        els.fields[0].focus();
        showToast(`${name} added`);
        await loadStudents();
      } catch (_) {
        showError('Could not reach the server. Make sure the backend is running.');
      } finally {
        els.addBtn.disabled = false;
        els.addBtn.textContent = 'Add student';
      }
    }

    async function deleteStudent(id, name) {
      if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
      try {
        const res = await fetch(`${API_URL}/students/${id}`, { method: 'DELETE' });
        if (!res.ok && res.status !== 404) throw new Error();
        showToast(`${name} deleted`);
        await loadStudents();
      } catch (_) {
        showToast('Could not delete the student. Try again.');
      }
    }

    els.addBtn.addEventListener('click', addStudent);
    els.fields.forEach((f) =>
      f.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addStudent();
      })
    );
    els.rows.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (btn) deleteStudent(btn.dataset.id, btn.dataset.name);
    });

    loadStudents();
  </script>
</body>
</html>
